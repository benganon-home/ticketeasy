name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install web deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Install functions deps
        run: npm ci --prefix functions
      - name: Typecheck functions
        run: npm run lint --prefix functions
      - name: Functions unit tests
        run: npm test --prefix functions

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      - name: Install firebase-tools
        run: npm i -g firebase-tools
      - name: Install rules test deps
        working-directory: tests/rules
        run: npm install
      - name: Run rules tests
        working-directory: tests/rules
        run: npm test
